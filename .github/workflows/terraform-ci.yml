name: terraform-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # mínimo privilegio: solo lectura del repo

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1   # la misma versión que tienes local

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Init (sin backend, sin Azure)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate